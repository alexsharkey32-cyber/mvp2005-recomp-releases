# publishes the game build in dist/ as a release (branch publish-vX.Y.Z)
name: publish
on:
  push:
    branches: ['publish-v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v4
      - run: |
          tag=${GITHUB_REF_NAME#publish-}
          title="MVP Baseball 2005 Recomp $tag — $(cat dist/title.txt)"
          gh release create "$tag" dist/*.zip dist/*.tar.gz dist/*.apk --repo "$GITHUB_REPOSITORY" --target main --title "$title" --notes-file dist/notes.md --latest
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[]|[.name,.size,.digest]|@tsv'
