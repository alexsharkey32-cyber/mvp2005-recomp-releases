name: announce-v1.6.2
on:
  push:
    branches: [announce-v1.6.2]
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v4
      - run: gh release edit v1.6.2 --repo "$GITHUB_REPOSITORY" --title "MVP Baseball 2005 Recomp v1.6.2: rosters apply right away, new player faces" --notes-file notes.md
