# Builds the Android preview APK from an encrypted copy of the private source (build-src/src.tar.xz.enc) and
# puts it in the android-testers draft release (not public). The key is the MVP_SRC_KEY Actions secret.
name: android-apk
on:
  push:
    branches: [android-apk]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the source
        env: { KEY: '${{ secrets.MVP_SRC_KEY }}' }
        run: |
          test -n "$KEY" || { echo "::error::Add the MVP_SRC_KEY secret (Settings > Secrets and variables > Actions)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/src"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY -in build-src/src.tar.xz.enc | xz -d | tar x -C "$RUNNER_TEMP/src"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build the arm64 APK
        working-directory: ${{ runner.temp }}/src
        run: |
          gradle -p android -PmvpAbi=arm64-v8a --max-workers=4 assembleDebug
          apk=$(find android/build/outputs/apk/debug -name '*.apk')
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          for lib in libSDL2.so libgame.so libc++_shared.so; do unzip -Z1 "$apk" | grep -Fx "lib/arm64-v8a/$lib"; done
          cp "$apk" "$RUNNER_TEMP/MVP2005-Android-arm64-v8a.apk"
          ls -l "$RUNNER_TEMP"/*.apk
      # Tester builds go to a draft release, which only people with access to this repository can see.
      - name: Put it in the private tester draft
        run: |
          tag=android-testers
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --title "Android tester build" --notes "Private: share the APK only with testers."
          fi
          gh release upload "$tag" "$RUNNER_TEMP/MVP2005-Android-arm64-v8a.apk" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Keep the APK off the public release
        run: |
          gh release delete-asset v1.5 MVP2005-Android-arm64-v8a.apk --repo "$GITHUB_REPOSITORY" -y || true
          gh release edit v1.5 --repo "$GITHUB_REPOSITORY" --notes-file build-src/notes.md
          gh release view v1.5 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
